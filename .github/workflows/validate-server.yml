name: BioEvidence delivery checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - run: node scripts/bio-prepare.mjs --bun (Get-Command bun).Source
        shell: pwsh
      - run: node scripts/bio-launch.mjs install install --frozen-lockfile
      - run: node scripts/bio-validate.mjs
      - run: node scripts/bio-launch.mjs build run scripts/bio-desktop-package.ts
      - run: node scripts/bio-launch.mjs build run scripts/bio-server-package.ts
      # No release, upload, upstream update URL, or account/model secret is used.
