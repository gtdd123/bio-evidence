name: BioEvidence Windows validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bio-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Register project-local runtime
        shell: pwsh
        run: node scripts/bio-prepare.mjs --bun (Get-Command bun).Source
      - name: Install locked dependencies in isolated environment
        run: node scripts/bio-launch.mjs install install --frozen-lockfile
      - name: BioEvidence regression, types, builds and resource checks
        run: node scripts/bio-validate.mjs
      - name: Inherited MCP compatibility regression
        run: node scripts/bio-launch.mjs test test packages/shared/src/mcp/__tests__/validation.test.ts
